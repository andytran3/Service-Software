# Local development database only. Values come from the root .env (copy .env.example).
# `npm run db:down` stops the container but keeps the named volume and its data.
name: service-software

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is first initialized.
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      # Check over TCP so the temporary init-time server (socket only) is not reported as ready.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
